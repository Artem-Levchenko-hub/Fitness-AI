services:
  db:
    image: pgvector/pgvector:pg15
    container_name: fitness_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
