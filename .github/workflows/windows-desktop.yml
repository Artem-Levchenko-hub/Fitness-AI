name: Build Windows Desktop (Vibe-trainer)

on:
  workflow_dispatch:
  push:
    branches: [chore/android-twa-build]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate branded assets (icon + installer images)
        run: npm run assets

      - name: Build signed-less NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vibe-trainer-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
