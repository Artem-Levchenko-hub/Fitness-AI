name: Build Windows Desktop (Vibe-trainer)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      publisher:
        description: Verified Authenticode publisher shown to users
        value: ${{ jobs.build.outputs.publisher }}
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: true
      WINDOWS_CERTIFICATE_PASSWORD:
        required: true
      WINDOWS_CERTIFICATE_SHA256:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      publisher: ${{ steps.verify-signature.outputs.publisher }}
    # The environment must require owner approval before the Authenticode
    # certificate is exposed to the runner.
    environment: windows-signing
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'

      - name: Install locked dependencies
        run: npm ci

      - name: Test auto-update lifecycle
        run: npm test

      - name: Generate branded assets (icon + installer images)
        run: npm run assets

      - name: Build Authenticode-signed NSIS installer and update metadata
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or
              [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Authenticode certificate secrets are required"
          }
          npx electron-builder --win nsis --publish never

      - id: verify-signature
        name: Verify Windows release artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_SHA256: ${{ secrets.WINDOWS_CERTIFICATE_SHA256 }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist/Vibe-trainer-Windows-x64-Setup-v$version.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "dist/latest.yml"
          foreach ($file in @($installer, $blockmap, $metadata)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release artifact: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty release artifact: $file"
            }
          }
          $latest = Get-Content -Raw -LiteralPath $metadata
          if ($latest -notmatch "(?m)^version: $([regex]::Escape($version))$") {
            throw "latest.yml version does not match $version"
          }
          if ($latest -notmatch [regex]::Escape("Vibe-trainer-Windows-x64-Setup-v$version.exe")) {
            throw "latest.yml does not reference the installer"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Installer Authenticode signature is not valid: $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate) {
            throw "Installer has no Authenticode signer certificate"
          }
          $expectedFingerprint = $env:WINDOWS_CERTIFICATE_SHA256.Replace(':', '').ToUpperInvariant()
          if ($expectedFingerprint -notmatch '^[A-F0-9]{64}$') {
            throw "WINDOWS_CERTIFICATE_SHA256 must contain a SHA-256 certificate fingerprint"
          }
          $actualFingerprint = $signature.SignerCertificate.GetCertHashString(
            [System.Security.Cryptography.HashAlgorithmName]::SHA256
          ).ToUpperInvariant()
          if ($actualFingerprint -ne $expectedFingerprint) {
            throw "Installer was signed by an unexpected Authenticode certificate"
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          if ($publisher -notmatch '^[\p{L}\p{N} .,&()_-]{1,128}$') {
            throw "Authenticode publisher contains unsupported characters"
          }
          "publisher=$publisher" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $packagedFiles = npx --no-install asar list dist/win-unpacked/resources/app.asar |
            ForEach-Object { $_ -replace '\\', '/' }
          foreach ($requiredFile in @("/update-verifier.js", "/update-public-key.pem")) {
            if ($packagedFiles -notcontains $requiredFile) {
              throw "Missing packaged update verification file: $requiredFile"
            }
          }

      - name: Upload signed installer and auto-update metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibe-trainer-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
