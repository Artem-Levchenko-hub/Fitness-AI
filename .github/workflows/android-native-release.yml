name: Build signed native Android app

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: android-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: android-signing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require successful checks for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 30 --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
          gh run list --workflow android-native.yml --commit "$GITHUB_SHA" --status success --limit 30 --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '17'
      - name: Build with the existing Android release key
        working-directory: android/native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/fitness-native-release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify package and release certificate
        run: |
          set -euo pipefail
          APK=android/native/app/build/outputs/apk/release/app-release.apk
          CERT_OUTPUT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          APPROVED="$(jq -r '.fingerprints[] | select(.name == "Vibe-trainer release key") | .value' android/twa-manifest.json | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$APPROVED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='app.leadgenerator.fitness' versionCode='13' versionName='1.3.2'"
      - name: Upload signed native APK and bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibe-trainer-kotlin-1.3.2-release
          path: |
            android/native/app/build/outputs/apk/release/app-release.apk
            android/native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
