name: Android native preview

on:
  workflow_dispatch:
  pull_request:
    paths: ['android/native/**', '.github/workflows/android-native.yml']
  push:
    branches: ['master', 'codex/**']
    paths: ['android/native/**', '.github/workflows/android-native.yml']

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the runner's Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Test and assemble preview APK
        working-directory: android/native
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibe-trainer-native-preview
          path: android/native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
