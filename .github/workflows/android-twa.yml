name: Build Android TWA (Vibe-trainer)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # This environment must require an owner approval in GitHub before it is
    # used for release-key access. The workflow itself cannot create that rule.
    environment: android-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli@1.24.1

      - name: Configure Bubblewrap (non-interactive)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          # Bubblewrap expects a legacy "tools" dir alongside cmdline-tools
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_SDK_ROOT/tools" || true

      - name: Decode signing keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore
          test -s android/android.keystore

      - name: Build signed APK + AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The production host may still be awaiting DNS/TLS during a release
          # cutover. Bubblewrap only needs the icon URLs to generate launcher
          # artwork, so use immutable assets from the exact GitHub revision.
          # webManifestUrl is optional for non-ChromeOS/Meta Quest builds and is
          # removed only from the ephemeral CI copy to avoid a live-host fetch.
          RAW_ICON_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/public/icons"
          jq \
            --arg icon "$RAW_ICON_BASE/icon-512.png" \
            --arg maskable "$RAW_ICON_BASE/maskable-512.png" \
            '.iconUrl = $icon | .maskableIconUrl = $maskable | del(.webManifestUrl)' \
            twa-manifest.json > twa-manifest.ci.json
          mv twa-manifest.ci.json twa-manifest.json
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          echo "=== artifacts ==="
          ls -la *.apk *.aab

      - name: Verify Android release metadata and signatures
        working-directory: android
        run: |
          APK="./app-release-signed.apk"
          AAB="./app-release-bundle.aab"
          test -s "$APK" -a -s "$AAB"
          CERT_OUTPUT="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$CERT_OUTPUT"
          CERT_SHA256="$(echo "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          MANIFEST_SHA256="$(jq -r '.fingerprints[] | select(.name == "Vibe-trainer release key") | .value' twa-manifest.json | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ASSETLINKS_SHA256="$(jq -r '.[].target.sha256_cert_fingerprints[]' ../public/.well-known/assetlinks.json | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$MANIFEST_SHA256"
          test "$CERT_SHA256" = "$ASSETLINKS_SHA256"
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")"
          VERSION_NAME="$(jq -r '.appVersionName' twa-manifest.json)"
          VERSION_CODE="$(jq -r '.appVersionCode' twa-manifest.json)"
          echo "$BADGING" | grep "package: name='app.leadgenerator.fitness' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          echo "$BADGING" | grep "targetSdkVersion:'36'"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/aab-verify.log
          grep -q "jar verified" /tmp/aab-verify.log
          AAB_CERT_SHA256="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^SHA256: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$AAB_CERT_SHA256"
          test "$AAB_CERT_SHA256" = "$MANIFEST_SHA256"
          test "$AAB_CERT_SHA256" = "$ASSETLINKS_SHA256"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibe-trainer-android
          path: |
            android/*.apk
            android/*.aab
          if-no-files-found: error
