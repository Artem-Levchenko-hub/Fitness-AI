<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Fitness AI</title>
  <desc id="desc">Тренировочный дневник с AI-анализом, статистикой и поддержкой Myo-reps</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.58" stop-color="#e9efe5"/>
      <stop offset="1" stop-color="#d4e1d2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#254936"/>
      <stop offset="1" stop-color="#173125"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7a052"/>
      <stop offset="1" stop-color="#f0c77d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#183526" flood-opacity=".16"/>
    </filter>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#315c43" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1440" height="520" rx="36" fill="url(#background)"/>
  <rect width="1440" height="520" rx="36" fill="url(#grain)"/>
  <path d="M0 410C214 320 325 484 527 407c205-78 306-231 522-155 168 59 254 9 391-51v319H0Z" fill="#3a6b4a" opacity=".08"/>

  <g transform="translate(92 72)">
    <rect width="72" height="72" rx="20" fill="#3a6b4a"/>
    <g transform="translate(36 36)" fill="#f7f4ec">
      <rect x="-22" y="-3" width="44" height="6" rx="3"/>
      <rect x="-29" y="-13" width="6" height="26" rx="2"/>
      <rect x="-21" y="-10" width="5" height="20" rx="2"/>
      <rect x="16" y="-10" width="5" height="20" rx="2"/>
      <rect x="23" y="-13" width="6" height="26" rx="2"/>
    </g>
    <text x="96" y="51" fill="#224330" font-family="Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">FITNESS AI</text>

    <text x="0" y="152" fill="#173125" font-family="Georgia, serif" font-size="48" font-weight="700" letter-spacing="-1.5">
      Тренируйся осознанно.
    </text>
    <text x="0" y="211" fill="#173125" font-family="Georgia, serif" font-size="48" font-weight="700" letter-spacing="-1.5">
      Прогрессируй доказательно.
    </text>
    <text x="2" y="260" fill="#42624f" font-family="Arial, sans-serif" font-size="23">
      Дневник тренировок, который помнит контекст и объясняет следующий шаг.
    </text>

    <g transform="translate(0 318)" font-family="Arial, sans-serif">
      <g>
        <rect width="164" height="54" rx="27" fill="#fff" fill-opacity=".72" stroke="#bed0be"/>
        <circle cx="27" cy="27" r="7" fill="#3a6b4a"/>
        <text x="46" y="34" fill="#274c37" font-size="17" font-weight="700">10 сессий</text>
      </g>
      <g transform="translate(178)">
        <rect width="162" height="54" rx="27" fill="#fff" fill-opacity=".72" stroke="#bed0be"/>
        <path d="M22 31c8-18 15 8 25-9" fill="none" stroke="#d0933e" stroke-width="4" stroke-linecap="round"/>
        <text x="55" y="34" fill="#274c37" font-size="17" font-weight="700">Myo-reps</text>
      </g>
      <g transform="translate(354)">
        <rect width="208" height="54" rx="27" fill="#fff" fill-opacity=".72" stroke="#bed0be"/>
        <rect x="20" y="17" width="20" height="20" rx="5" fill="none" stroke="#3a6b4a" stroke-width="3"/>
        <text x="54" y="34" fill="#274c37" font-size="17" font-weight="700">PWA + Android</text>
      </g>
    </g>
  </g>

  <g transform="translate(920 60)" filter="url(#shadow)">
    <rect width="390" height="420" rx="38" fill="url(#screen)"/>
    <rect x="28" y="27" width="334" height="58" rx="18" fill="#fff" fill-opacity=".08"/>
    <circle cx="60" cy="56" r="13" fill="#f0c77d"/>
    <rect x="85" y="43" width="125" height="9" rx="4.5" fill="#f7f4ec" fill-opacity=".9"/>
    <rect x="85" y="61" width="78" height="7" rx="3.5" fill="#a8c1ad"/>

    <text x="30" y="130" fill="#a8c1ad" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">НЕДЕЛЬНЫЙ ПРОГРЕСС</text>
    <text x="30" y="176" fill="#f7f4ec" font-family="Georgia, serif" font-size="42" font-weight="700">+12.4%</text>
    <text x="190" y="174" fill="#98b39f" font-family="Arial, sans-serif" font-size="16">объём нагрузки</text>

    <g transform="translate(30 207)">
      <path d="M0 100C32 92 49 58 78 68s41 36 70 9 39-63 72-45 48 47 74 6 45-24 64-38" fill="none" stroke="#527a60" stroke-width="14" stroke-linecap="round" opacity=".32"/>
      <path d="M0 100C32 92 49 58 78 68s41 36 70 9 39-63 72-45 48 47 74 6 45-24 64-38" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="358" cy="0" r="8" fill="#f0c77d"/>
    </g>

    <g transform="translate(28 343)" font-family="Arial, sans-serif">
      <rect width="160" height="50" rx="16" fill="#fff" fill-opacity=".09"/>
      <text x="16" y="21" fill="#91aa98" font-size="11" font-weight="700">AI-РАЗБОР</text>
      <text x="16" y="39" fill="#f7f4ec" font-size="15" font-weight="700">Готов к просмотру</text>
      <rect x="174" width="160" height="50" rx="16" fill="#fff" fill-opacity=".09"/>
      <text x="190" y="21" fill="#91aa98" font-size="11" font-weight="700">СЕРИЯ</text>
      <text x="190" y="39" fill="#f7f4ec" font-size="15" font-weight="700">4 недели подряд</text>
    </g>
  </g>
</svg>
