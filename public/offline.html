<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет подключения — Fitness SaaS</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f6f4ef;
        color: #3a3a36;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2rem;
      }
      .container {
        text-align: center;
        max-width: 380px;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        opacity: 0.5;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #6b6b66;
        margin-bottom: 2rem;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 3.5rem;
        padding: 0 2rem;
        background: #3a6b4a;
        color: #f6f4ef;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
        min-width: 200px;
      }
      button:hover {
        opacity: 0.9;
      }
      button:active {
        transform: scale(0.97);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #2d2c28;
          color: #e8e6e0;
        }
        p {
          color: #9b9a94;
        }
        .icon {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
      <h1>Нет подключения</h1>
      <p>
        Для работы с тренировками необходимо подключение к интернету. Проверьте
        соединение и попробуйте снова.
      </p>
      <button onclick="window.location.reload()">Обновить страницу</button>
    </div>
  </body>
</html>
