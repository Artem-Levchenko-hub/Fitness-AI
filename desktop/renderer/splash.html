<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-user-select:none;user-select:none}
  .card{position:absolute;inset:14px;border-radius:28px;
    background:linear-gradient(160deg,#46815a 0%,#3a6b4a 55%,#2c5239 100%);
    box-shadow:0 18px 50px rgba(22,39,28,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .barbell{width:128px;height:128px;animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .name{color:#f6f4ef;font-size:26px;font-weight:700;letter-spacing:.5px}
  .sub{color:#cfe0d4;font-size:12.5px;margin-top:-10px}
  .bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar::after{content:"";display:block;height:100%;width:40%;border-radius:4px;background:#f6f4ef;
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
</style></head>
<body><div class="card">
  <svg class="barbell" viewBox="0 0 512 512" fill="#f6f4ef">
    <g transform="translate(256,256) scale(1.7)">
      <rect x="-120" y="-12" width="240" height="24" rx="12"/>
      <rect x="-152" y="-58" width="30" height="116" rx="9"/>
      <rect x="-120" y="-44" width="24" height="88" rx="7"/>
      <rect x="96" y="-44" width="24" height="88" rx="7"/>
      <rect x="122" y="-58" width="30" height="116" rx="9"/>
    </g>
  </svg>
  <div class="name">Vibe-trainer</div>
  <div class="sub">Силовые тренировки с AI</div>
  <div class="bar"></div>
</div></body></html>
