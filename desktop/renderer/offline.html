<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#f6f4ef;font-family:"Segoe UI",system-ui,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;color:#2c3a30}
  .wrap{text-align:center;max-width:380px;padding:24px}
  svg{width:88px;height:88px;opacity:.85;margin-bottom:12px}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;color:#5b6b60;margin:0 0 22px;line-height:1.5}
  button{border:0;border-radius:12px;background:#3a6b4a;color:#f6f4ef;font-size:15px;font-weight:600;
    padding:12px 26px;cursor:pointer;transition:.15s}
  button:hover{background:#2f5a3d}
</style></head>
<body><div class="wrap">
  <svg viewBox="0 0 512 512" fill="#3a6b4a"><g transform="translate(256,256) scale(1.3)">
    <rect x="-120" y="-12" width="240" height="24" rx="12"/>
    <rect x="-152" y="-58" width="30" height="116" rx="9"/><rect x="-120" y="-44" width="24" height="88" rx="7"/>
    <rect x="96" y="-44" width="24" height="88" rx="7"/><rect x="122" y="-58" width="30" height="116" rx="9"/>
  </g></svg>
  <h1>Нет подключения</h1>
  <p>Vibe-trainer работает онлайн. Проверьте интернет и попробуйте снова.</p>
  <button onclick="window.vibe && window.vibe.reload()">Повторить</button>
</div></body></html>
